name: Probar nuevo diseño

on:
  workflow_dispatch:
  push:
    branches:
      - nuevo-diseno-app

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar aplicación
        run: npm run build
